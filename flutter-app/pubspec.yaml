name: foodplan
description: FoodPlan - AI-powered meal planning
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.1

  # Local DB (Room equivalent)
  drift: ^2.21.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.25

  # Settings (DataStore equivalent)
  shared_preferences: ^2.3.3

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  collection: ^1.18.0
  path_provider: ^2.1.4
  path: ^1.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
